app-id: net.teuniz.dsremote
runtime: org.kde.Platform
runtime-version: 6.4
sdk: org.kde.Sdk
command: DSRemote
desktop-file-name-suffix: '' # used to create development version
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home # to save images
  - --share=network # for the LAN connection needed
  - --device=all # to access usb devices

modules:
  - name: DSRemote
    buildsystem: cmake
    builddir: true
    sources:
      - type: git
        url: https://gitlab.com/Teuniz/DSRemote.git
        tag: d416e1b3fdfdd8702ca44693739492d897dbd599
      - type: patch
        path: cmake-buildsystem.patch
    build-options:
      cflags: -Wp,-U_FORTIFY_SOURCE  # Remove _FORTIFY_SOURCE
      cxxflags: -Wp,-U_FORTIFY_SOURCE
      env:
        CPPFLAGS: -Wp,-U_FORTIFY_SOURCE
